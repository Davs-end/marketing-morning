name: Test Marketing Morning

on:
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Installer les dependances
        run: |
          pip install -r requirements.txt

      - name: Collecter les articles
        run: |
          python scripts/collect.py

      - name: Analyser avec Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze.py

      - name: Afficher l'analyse
        run: |
          echo "===== ANALYSE MARKETING ====="
          cat analysis.json

      - name: Afficher le rapport d'execution
        if: always()
        run: |
          echo "===== RAPPORT D'EXECUTION ====="

          if [ -f execution_report.json ]; then
            cat execution_report.json
          else
            echo "execution_report.json introuvable"
          fi

      - name: Generer le mail
        run: |
          python scripts/generate_email.py

      - name: Verifier la configuration email
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          if [ -z "$GMAIL_SENDER" ]; then
            echo "ERREUR : GMAIL_SENDER est absent"
            exit 1
          fi

          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "ERREUR : GMAIL_APP_PASSWORD est absent"
            exit 1
          fi

          echo "Configuration email : OK"
          echo "Expediteur configure : $GMAIL_SENDER"

      - name: Afficher le mail genere
        run: |
          echo "===== EMAIL MARKETING MORNING ====="
          cat marketing_morning.html
